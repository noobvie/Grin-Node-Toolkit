<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miners | Grin Pool ツ</title>
  <link rel="stylesheet" href="/css/pool.css">
  <link rel="stylesheet" href="/admin/styles.css">
  <style>
    /* Status dot. Colour is never the only signal: every dot sits inside a control whose
       aria-label and tooltip spell the state out, and the filter chips double as the legend. */
    .mn-dot {
      display: inline-block; flex-shrink: 0;
      width: .6rem; height: .6rem; border-radius: 50%;
      background: var(--text-muted);
    }
    .mn-st-mining     { background: var(--ok-color); box-shadow: 0 0 4px var(--ok-color); }
    .mn-st-degraded   { background: var(--warn-color); }
    .mn-st-connecting { background: transparent; box-shadow: inset 0 0 0 2px var(--warn-color); }
    .mn-st-offline    { background: var(--text-muted); }
    .mn-st-banned     { background: var(--error-color); }

    .mn-chips .tab-btn { display: inline-flex; align-items: center; gap: .4rem; }
    /* An author `display` beats the UA's [hidden] rule, so the Connecting chip needs this. */
    .mn-chips .tab-btn[hidden] { display: none; }
    .mn-n { font-family: var(--font-mono); font-size: .78rem; color: var(--text-dim); }
    .mn-updated { font-size: .8rem; color: var(--text-dim); font-weight: 400; margin-left: .8rem; }
    .mn-scope { font-size: .82rem; color: var(--text-dim); margin: 0 0 .7rem; line-height: 1.5; }
    .mn-scope:empty { display: none; }

    /* Sortable headers: the button fills the cell so the whole header is the target. */
    .mn-sort {
      all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: .25rem;
      font: inherit; color: inherit; white-space: nowrap;
    }
    .mn-sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
    .mn-sort::after { content: '↕'; font-size: .75em; opacity: .35; }
    th[aria-sort="ascending"]  .mn-sort::after { content: '↑'; opacity: 1; color: var(--accent); }
    th[aria-sort="descending"] .mn-sort::after { content: '↓'; opacity: 1; color: var(--accent); }

    /* Miner cell: [▸ ● grin1…] [⧉]. The address button expands the row; copying moved to its
       own icon because one click cannot both copy and expand. */
    .mn-cell { display: flex; align-items: center; gap: .35rem; white-space: nowrap; }
    .mn-toggle {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .15rem .3rem; margin: 0; border: 0; border-radius: 6px; background: none;
      color: inherit; cursor: pointer; font-family: var(--font-mono); font-size: .82rem;
    }
    .mn-toggle:hover { color: var(--accent); background: var(--bg-card2); }
    .mn-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .mn-chev { display: inline-block; width: .7rem; color: var(--text-dim); transition: transform .15s ease; }
    .mn-toggle[aria-expanded="true"] .mn-chev { transform: rotate(90deg); color: var(--accent); }
    .mn-copy { border-bottom: 0; font-size: .9rem; }
    tr.mn-row { cursor: pointer; }
    tr.mn-row.is-open > td { background: var(--bg-card2); }

    .mn-warn { color: var(--warn-color); }
    .mn-dim  { color: var(--text-dim); }

    /* Expanded row. The inner block is sticky-left so, on a phone where the table scrolls
       sideways, the details stay in view instead of sliding off with the columns. */
    tr.mn-detail > td { padding: 0; background: var(--bg-card2); border-top: 0; }
    .mn-inner {
      position: sticky; left: 0;
      max-width: min(100%, calc(100vw - 2rem));
      padding: .9rem 1rem 1.1rem 2.2rem;
      box-sizing: border-box;
    }
    .mn-facts {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: .7rem 1.4rem; margin: 0 0 1rem;
    }
    .mn-fact dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 0 0 .15rem; }
    .mn-fact dd { margin: 0; font-size: .88rem; line-height: 1.5; }
    .mn-fact-wide { grid-column: 1 / -1; }
    .mn-sub { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin: 0 0 .4rem; }
    .mn-rigs-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
    .mn-rigs { width: 100%; font-size: .82rem; }
    .mn-rigs th, .mn-rigs td { padding: .4rem .6rem; white-space: nowrap; }
    .mn-rig-name { display: inline-flex; align-items: center; gap: .4rem; font-family: var(--font-mono); }
    .mn-links { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-top: .9rem; }
    .mn-stale-note { font-size: .8rem; color: var(--warn-color); margin: 0 0 .6rem; }

    #mn-dialog-addr { word-break: break-all; font-family: var(--font-mono); font-size: .8rem; margin: 0 0 1rem; }
  </style>
</head>
<body>

<main>
  <div class="container">
    <section>
      <h2>
        All Miners
        <span class="mn-updated" id="miner-updated"></span>
      </h2>

      <!-- Status chips = the filter AND the legend for the dots. One at a time; the address
           filter lives in the AdminTable tools bar directly above the table. -->
      <div class="tabs mn-chips" id="status-chips" role="group" aria-label="Filter miners by status">
        <button type="button" class="tab-btn active" data-filter="" aria-pressed="true">All <span class="mn-n" id="n-all">–</span></button>
        <button type="button" class="tab-btn" data-filter="mining" aria-pressed="false"><span class="mn-dot mn-st-mining" aria-hidden="true"></span>Mining <span class="mn-n" id="n-mining">–</span></button>
        <button type="button" class="tab-btn" data-filter="degraded" aria-pressed="false"><span class="mn-dot mn-st-degraded" aria-hidden="true"></span>Degraded <span class="mn-n" id="n-degraded">–</span></button>
        <button type="button" class="tab-btn" data-filter="connecting" aria-pressed="false" id="chip-connecting" hidden><span class="mn-dot mn-st-connecting" aria-hidden="true"></span>Connecting <span class="mn-n" id="n-connecting">–</span></button>
        <button type="button" class="tab-btn" data-filter="offline" aria-pressed="false"><span class="mn-dot mn-st-offline" aria-hidden="true"></span>Offline <span class="mn-n" id="n-offline">–</span></button>
        <button type="button" class="tab-btn" data-filter="banned" aria-pressed="false"><span class="mn-dot mn-st-banned" aria-hidden="true"></span>Banned <span class="mn-n" id="n-banned">–</span></button>
      </div>
      <!-- What the list holds (it is capped). Written with textContent from the API's counts. -->
      <p class="mn-scope" id="miner-scope"></p>
      <p class="error-msg" id="miner-msg" role="status" style="display:none;margin:0 0 .8rem;"></p>

      <div class="card" style="padding:0;">
        <div class="table-wrap">
          <table id="miners-table">
            <thead>
              <tr>
                <th aria-sort="none"><button type="button" class="mn-sort" data-sort="status">Miner</button></th>
                <th aria-sort="none"><button type="button" class="mn-sort" data-sort="workers">Rigs</button></th>
                <th aria-sort="none"><button type="button" class="mn-sort" data-sort="hashrate">Hashrate · <span id="hr-win">10 min</span></button></th>
                <th aria-sort="descending"><button type="button" class="mn-sort" data-sort="balance">Balance ツ</button></th>
                <th aria-sort="none"><button type="button" class="mn-sort" data-sort="locked">Locked ツ</button></th>
                <th aria-sort="none"><button type="button" class="mn-sort" data-sort="paid">Paid ツ</button></th>
                <th aria-sort="none"><button type="button" class="mn-sort" data-sort="last">Last Active</button></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="miners-tbody">
              <tr class="loading-row"><td colspan="8"><span class="spinner"></span>Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>
</main>

<!-- One in-page dialog for ban / unban / clear-Tor-pause. Not prompt()/confirm(): the step-up
     dialog (stepup.js) opens straight after it, from an async continuation, and browsers
     throttle a native dialog followed by another, so a native prompt could come back null
     without ever being shown (design §13.12r). Static markup; every value is set with
     textContent. -->
<div class="modal-overlay" id="mn-dialog" role="dialog" aria-modal="true" aria-labelledby="mn-dialog-title">
  <form class="modal" id="mn-dialog-form" novalidate>
    <h3 id="mn-dialog-title"></h3>
    <p id="mn-dialog-body" style="margin:0 0 .6rem;color:var(--text-dim);font-size:.9rem;line-height:1.5;"></p>
    <p id="mn-dialog-addr"></p>
    <div class="form-group" id="mn-dialog-field">
      <label for="mn-dialog-input" id="mn-dialog-label"></label>
      <input type="text" id="mn-dialog-input" maxlength="280" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="mn-dialog-cancel">Cancel</button>
      <button type="submit" class="btn" id="mn-dialog-ok"></button>
    </div>
  </form>
</div>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/admin/admin-shell.js"></script>
<script src="/js/stepup.js"></script>
<script src="/admin/js/miners.js"></script>
</body>
</html>
