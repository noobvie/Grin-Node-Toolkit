<svg xmlns="http://www.w3.org/2000/svg" width="728" height="90" viewBox="0 0 728 90" role="img" aria-label="Keep the reactor running — donate GRIN and join the donor wall">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120e07"/>
      <stop offset=".55" stop-color="#07090c"/>
      <stop offset="1" stop-color="#100d08"/>
    </linearGradient>
    <radialGradient id="heartGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb63d" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#ffb63d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffb63d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc65e"/>
      <stop offset="1" stop-color="#e69a1f"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="726" height="88" rx="9"/></clipPath>
  </defs>

  <rect x="1" y="1" width="726" height="88" rx="9" fill="url(#bg)" stroke="#3d2f14" stroke-width="1.5"/>

  <g clip-path="url(#frame)">
    <!-- rising ember particles -->
    <g fill="#ffb63d" fill-opacity=".55">
      <circle cx="120" cy="90" r="1.8"><animate attributeName="cy" values="95;-6" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="90" r="1.5"><animate attributeName="cy" values="95;-6" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="90" r="1.8"><animate attributeName="cy" values="95;-6" dur="7s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="90" r="1.4"><animate attributeName="cy" values="95;-6" dur="9s" begin="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- heart core -->
    <g transform="translate(52,45)">
      <circle r="40" fill="url(#heartGlow)">
        <animate attributeName="opacity" values=".7;1;.7" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M0,15 C-3,10 -20,0 -20,-9 C-20,-17 -13,-20 -8,-20 C-4,-20 -1,-18 0,-14 C1,-18 4,-20 8,-20 C13,-20 20,-17 20,-9 C20,0 3,10 0,15 Z"
            fill="#170f06" stroke="#ffb63d" stroke-width="1.8">
        <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <text x="0" y="1.5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#ffb63d">ツ</text>
    </g>

    <!-- copy -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace">
      <text x="104" y="40" font-size="22" font-weight="bold" fill="#efe9dd" letter-spacing="1">KEEP THE <tspan fill="#ffb63d">REACTOR</tspan> RUNNING</text>
      <text x="104" y="63" font-size="12.5" fill="#8a978f" letter-spacing=".5">Every donation funds nodes, gateways &amp; the prize pool · donors get a spot on the wall</text>
    </g>

    <!-- CTA -->
    <g transform="translate(566,31)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="url(#cta)"/>
      <text x="70" y="19" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="bold" fill="#120c04" letter-spacing="1">DONATE GRIN ♥</text>
    </g>
  </g>
</svg>
