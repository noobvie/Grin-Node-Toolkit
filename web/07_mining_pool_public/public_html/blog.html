<!DOCTYPE html>
<html lang="en" data-page="blog">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog — GRINIUM Mining Pool</title>
  <meta name="description" content="Pool news, updates and announcements.">
  <meta name="robots" content="index, follow, max-snippet:-1">
  <!-- blog.html is in sitemap.xml, so it needs the same head furniture as every other
       listed page: a canonical (index.js requires each sitemap URL to match the page's
       own canonical exactly), a favicon, and social cards. branding.js rewrites the
       canonical/og:url to the operator's configured site_url at runtime. -->
  <link rel="canonical" href="https://pool.grin.money/blog.html">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog — GRINIUM Mining Pool">
  <meta property="og:description" content="Pool news, updates and announcements.">
  <meta property="og:url" content="https://pool.grin.money/blog.html">
  <meta property="og:image" content="https://pool.grin.money/images/og-image.svg">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="alternate" type="application/rss+xml" title="Blog RSS" href="/blog/rss.xml">
  <style>
    .blog-wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem; }
    .blog-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .blog-head h1 { margin: 0; }
    .post-grid { display: grid; gap: 1.25rem; margin-top: 1.5rem; }
    .post-card { display: grid; grid-template-columns: 280px 1fr; gap: 1rem; background: var(--bg-elev);
      border: 1px solid var(--border); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit;
      transition: border-color .15s, box-shadow .15s; }
    /* Hover emphasis. The global `a:hover { text-decoration: underline }` in dashboard.css
       outranks the card's own `text-decoration: none` (the :hover adds specificity), so a
       hovered card grew an underline across the title, the date, the excerpt AND the tags —
       which reads as a broken link, not a card. Undo it here and emphasise the way the text
       ads do instead: the title takes the accent and italicises, the card lifts. */
    .post-card:hover, .post-card:focus-visible {
      text-decoration: none; border-color: var(--accent);
      box-shadow: 0 0 22px -8px var(--glow, transparent);
    }
    .post-card:hover h2, .post-card:focus-visible h2 { color: var(--accent); font-style: italic; }
    /* Stretch the cover to the card's full height so there is no dead panel under it (the
       body column is always taller than a 1200x630 cover scaled to this column's width).
       That crop is why the column is 280px and why the excerpt is clamped below: covers are
       authored wider than tall, object-fit:cover trims the SIDES, and the trim grows with
       card height. At 280px wide and the clamped max height, x=200..1000 of a 1200-wide
       cover survives — which is the safe zone the shipped cover is drawn inside. */
    .post-card .cover { display: block; width: 280px; height: 100%; min-height: 150px;
      object-fit: cover; background: var(--bg-elev2); }
    .post-card .no-cover { width: 280px; height: 100%; min-height: 150px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-elev2); color: var(--accent); font-size: 2rem; }
    .post-card .body { padding: 1rem 1.1rem 1.1rem 0; }
    .post-card h2 { margin: 0 0 .35rem; font-size: 1.25rem; transition: color .15s; }
    .post-card .meta { color: var(--text-dim); font-size: .85rem; margin-bottom: .5rem; }
    /* Bounded to 3 lines: keeps cards a consistent height in the list, and caps how far
       object-fit:cover can crop into the cover above. Full text is on the post page. */
    .post-card .excerpt { color: var(--text); font-size: .95rem; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden; }
    .tag { display: inline-block; font-size: .72rem; padding: .1rem .5rem; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); margin: .35rem .35rem 0 0; }
    .blog-pager { display: flex; justify-content: center; gap: .75rem; margin: 2rem 0 0; }
    .blog-pager button { padding: .5rem 1rem; border-radius: 6px; border: 1px solid var(--border);
      background: transparent; color: inherit; cursor: pointer; }
    .blog-pager button[disabled] { opacity: .4; cursor: default; }
    .muted { color: var(--text-dim); }
    @media (max-width: 620px) {
      .post-card { grid-template-columns: 1fr; }
      /* Stacked: the cover is a full-width banner, so let it keep the 1200x630 shape the
         covers are authored at instead of being squashed into a 130px letterbox. */
      .post-card .cover, .post-card .no-cover {
        width: 100%; height: auto; min-height: 0; aspect-ratio: 1200 / 630;
      }
      .post-card .body { padding: 0 1.1rem 1.1rem; }
    }
  </style>
  <link rel="stylesheet" href="/css/themes.css">
</head>
<body>
  <noscript>
    <div class="noscript-note">
      <b>JavaScript is required.</b> This site builds its navigation and loads its live
      figures in the browser, so with scripts blocked the page stays empty. Enable
      JavaScript for this site to use it. The pool's data is also available as plain
      JSON over its <a href="/api-docs.html">public API</a> if you would rather not.
    </div>
  </noscript>
  <!-- header injected by /js/public-shell.js -->

  <main class="blog-wrap" id="main" tabindex="-1">
    <div class="blog-head">
      <h1>Blog</h1>
      <a class="muted" href="/blog/rss.xml" title="RSS feed">RSS ⤵</a>
    </div>
    <div id="post-grid" class="post-grid">
      <p class="muted">Loading…</p>
    </div>
    <div id="pager" class="blog-pager" style="display:none;">
      <button id="prev" onclick="go(-1)">← Newer</button>
      <button id="next" onclick="go(1)">Older →</button>
    </div>
  </main>

  <!-- footer injected by /js/public-shell.js -->

  <script>
    (function () {
      var PAGE_SIZE = 8;
      var offset = 0, total = 0;

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function fmtDate(unix) {
        if (!unix) return '';
        try { return new Date(unix * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
        catch (e) { return ''; }
      }

      function render(data) {
        var grid = document.getElementById('post-grid');
        var posts = (data && data.posts) || [];
        total = (data && data.total) || 0;
        if (!posts.length) {
          grid.innerHTML = '<p class="muted">No posts yet. Check back soon.</p>';
          document.getElementById('pager').style.display = 'none';
          return;
        }
        grid.innerHTML = posts.map(function (p) {
          var href = '/blog/' + encodeURIComponent(p.slug);
          var cover = p.cover_image
            ? '<img class="cover" src="' + esc(p.cover_image) + '" alt="">'
            : '<div class="no-cover">📝</div>';
          var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
          return '<a class="post-card" href="' + href + '">' +
            cover +
            '<div class="body">' +
              '<h2>' + esc(p.title) + '</h2>' +
              '<div class="meta">' + esc(fmtDate(p.published_at)) + '</div>' +
              '<div class="excerpt">' + esc(p.excerpt || '') + '</div>' +
              '<div>' + tags + '</div>' +
            '</div>' +
          '</a>';
        }).join('');

        var pager = document.getElementById('pager');
        if (total > PAGE_SIZE) {
          pager.style.display = '';
          document.getElementById('prev').disabled = offset <= 0;
          document.getElementById('next').disabled = offset + PAGE_SIZE >= total;
        } else {
          pager.style.display = 'none';
        }
      }

      function load() {
        fetch('/api/public/posts?limit=' + PAGE_SIZE + '&offset=' + offset)
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) { render(j && j.data); window.scrollTo({ top: 0 }); })
          .catch(function () {
            document.getElementById('post-grid').innerHTML = '<p class="muted">Could not load posts.</p>';
          });
      }

      window.go = function (dir) {
        offset = Math.max(0, offset + dir * PAGE_SIZE);
        load();
      };

      load();
    })();
  </script>
  <script src="/js/public-shell.js"></script>
  <script src="/js/public-theme.js"></script>
  <script src="/js/branding.js"></script>
</body>
</html>
