<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miners | Grin Pool ツ</title>
  <link rel="stylesheet" href="/css/pool.css">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>

<main>
  <div class="container">
    <section>
      <h2>
        All Miners
        <span id="miner-summary" style="font-size:.82rem;color:var(--text-dim);font-weight:400;margin-left:.8rem;"></span>
      </h2>

      <!-- The address filter now lives in the AdminTable tools bar directly above the
           table (with the row count + paging); only the state toggles stay here. -->
      <div style="display:flex;gap:.6rem;align-items:center;margin-bottom:.8rem;flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;margin-bottom:0;">
          <input type="checkbox" id="online-only" onchange="filterMiners(true)"> Online only
        </label>
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.85rem;margin-bottom:0;">
          <input type="checkbox" id="banned-only" onchange="filterMiners(true)"> Banned only
        </label>
      </div>

      <div class="card" style="padding:0;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Address</th>
                <th>Online</th>
                <th>Balance ツ</th>
                <th>Locked ツ</th>
                <th>Shares</th>
                <th>Paid ツ</th>
                <th>Last Share</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="miners-tbody">
              <tr class="loading-row"><td colspan="8"><span class="spinner"></span>Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <p class="error-msg" id="miner-msg" style="display:none;margin-top:.6rem;"></p>

      <!-- Miner view: Tor payouts for ONE address (the 🧅 row button). The Tor pause is
           anti-abuse — 5 counted failed Tor payouts in 24 h (only "the miner's wallet did not
           answer" counts) pause Tor for that address for 24 h; Slatepack stays open. Clear it when
           the failures were the pool's fault: the rows are re-coded, never deleted. Times UTC. -->
      <div class="card" id="tp-card" style="display:none;padding:1rem;margin-top:1rem;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;">
          <strong>Tor payouts · <span class="mono" id="tp-addr"></span></strong>
          <button class="btn btn-sm btn-outline" onclick="closeTorPause()">✕ Close</button>
        </div>
        <div id="tp-body" style="margin-top:.6rem;font-size:.9rem;line-height:1.7;"></div>
        <div style="margin-top:.6rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
          <button class="btn btn-sm" id="tp-clear-btn" onclick="clearTorPause()" disabled>Clear Tor pause</button>
          <span id="tp-note" style="font-size:.8rem;color:var(--text-dim);"></span>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/admin/admin-shell.js"></script>
<script src="/js/stepup.js"></script>
<script>
let _allMiners = [];

// Auth gate (httpOnly-cookie aware): redirects to /login.html if not an admin, else wires
// up the topbar username + Logout. Pool name + testnet banner are handled by admin-shell.js.
// stepup.js provides adminFetch() for the step-up-gated ban/unban actions.
API.guardAdminPage();

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtGrin(v) { return (Number(v) || 0).toFixed(4); }
function timeAgo(t) {
  if (!t) return '—';
  const diff = Math.floor(Date.now() / 1000 - t);
  if (diff < 60)    return diff + 's ago';
  if (diff < 3600)  return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}
function shortAddr(a) {
  a = String(a || '');
  return a.length > 22 ? a.slice(0, 12) + '…' + a.slice(-7) : a;
}

// Address search + 20-per-page paging come from AdminTable (admin-shell.js); the
// Online/Banned toggles stay page-side and feed it a pre-filtered array. The list can
// run to 500 accounts, which is exactly the case that used to render in one dump.
const minersTable = AdminTable.create({
  tbody: 'miners-tbody',
  search: 'Filter by address…',
  empty: 'No miners found.',
  note: 'Miner accounts are kept permanently — the share and hashrate history behind ' +
        'them is pruned per <a href="/admin/settings-database.html">Settings → Database</a>. ' +
        'Top 500 accounts by balance.',
  text: m => m.grin_address || '',
  row: m => {
    const onlineBadge = m.is_online
      ? '<span class="badge badge-ok">Online</span>'
      : '<span class="badge badge-dim">Offline</span>';
    const bannedBadge = m.is_banned
      ? ` <span class="badge badge-error" title="${escHtml(m.ban_reason || '')}">Banned</span>` : '';
    // data-addr + this.dataset, NOT a value spliced into a JS string literal. escHtml() is an
    // HTML escaper: inside onclick="…" the parser decodes its &#39; back to a real ' BEFORE the
    // JS is parsed, so an apostrophe in the value closes the string and the rest executes. The
    // bech32 address charset is what stops that today (§J6-6) — a validator on another route, in
    // another file, is not the escaping this needs. Audit §J14.
    const action = m.is_banned
      ? `<button class="btn-icon" data-addr="${escHtml(m.grin_address)}" onclick="unbanMiner(this.dataset.addr)" data-tip="Unban this miner" aria-label="Unban this miner">✅</button>`
      : `<button class="btn-icon btn-icon-danger" data-addr="${escHtml(m.grin_address)}" onclick="banMiner(this.dataset.addr)" data-tip="Ban this miner" aria-label="Ban this miner">🚫</button>`;
    // The truncated address is itself the copy control: click (or Enter/Space) copies the
    // full address, handled by admin-shell.js via data-copy. The tip shows the full value
    // (the old title= did that, but a native tooltip can't be selected) above the hint.
    const addr = escHtml(m.grin_address);
    const addrCell = `<button type="button" class="addr-copy" data-copy="${addr}" ` +
      `data-tip="${addr}&#10;Click to copy" aria-label="Copy address ${escHtml(shortAddr(m.grin_address))}">` +
      `${escHtml(shortAddr(m.grin_address))}</button>`;
    const torBtn = `<button class="btn-icon" data-addr="${escHtml(m.grin_address)}" onclick="showTorPause(this.dataset.addr)" data-tip="Tor payouts: pause state, counted failures, pending" aria-label="Show Tor payout state">🧅</button>`;
    return `<tr>
      <td>${addrCell}${bannedBadge}</td>
      <td>${onlineBadge}</td>
      <td class="mono">${fmtGrin(m.balance)}</td>
      <td class="mono">${fmtGrin(m.balance_locked)}</td>
      <td class="mono">${m.shares_count != null ? m.shares_count : 0}</td>
      <td class="mono">${fmtGrin(m.total_paid)}</td>
      <td>${timeAgo(m.last_share_at)}</td>
      <td><div class="row-actions">${torBtn}${action}</div></td>
    </tr>`;
  }
});

async function loadMiners() {
  try {
    const data = await API.get('/api/admin/miners?limit=500');
    _allMiners = (data && data.miners) || [];
    const online = _allMiners.filter(m => m.is_online).length;
    const banned = _allMiners.filter(m => m.is_banned).length;
    document.getElementById('miner-summary').textContent =
      `${_allMiners.length} total · ${online} online · ${banned} banned`;
    filterMiners();
  } catch (err) {
    minersTable.setError(err.message);
  }
}

// `reset` is passed only when a toggle changed — the 30s refresh must not yank the
// operator back to page 1 while they are reading page 4.
function filterMiners(reset) {
  const onlineOnly = document.getElementById('online-only').checked;
  const bannedOnly = document.getElementById('banned-only').checked;
  let filtered = _allMiners;
  if (onlineOnly) filtered = filtered.filter(m => m.is_online);
  if (bannedOnly) filtered = filtered.filter(m => m.is_banned);
  minersTable.setRows([...filtered].sort((a, b) => (b.balance || 0) - (a.balance || 0)),
                      { reset: reset === true });
}

function flash(msg, isErr) {
  const el = document.getElementById('miner-msg');
  el.textContent = msg;
  el.className = isErr ? 'error-msg' : 'success-msg';
  el.style.display = '';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

async function banMiner(addr) {
  const reason = prompt(`Ban ${addr}?\n\nThis blocks new stratum logins (balance is kept and can still be paid out).\n\nOptional reason:`);
  if (reason === null) return;
  try {
    const res = await adminFetch('/api/admin/miners/' + encodeURIComponent(addr) + '/ban', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason })
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    flash('Miner banned.', false);
    loadMiners();
  } catch (err) { flash(err.message, true); }
}

async function unbanMiner(addr) {
  if (!confirm(`Unban ${addr}?`)) return;
  try {
    const res = await adminFetch('/api/admin/miners/' + encodeURIComponent(addr) + '/unban', { method: 'POST' });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    flash('Miner unbanned.', false);
    loadMiners();
  } catch (err) { flash(err.message, true); }
}

// ── Miner view: Tor pause ─────────────────────────────────────────────────────
// GET /api/admin/miners/:addr carries tor_pause = { failures_24h, max, paused_until|null } (the
// SAME object the miner's account page shows) and the pending payouts. Nothing here computes a
// pause: paused ⇔ the server sent paused_until.
let _tpAddr = null;
function fmtUtc(t) { return t ? new Date(t * 1000).toISOString().slice(0, 16).replace('T', ' ') + ' UTC' : '—'; }
async function showTorPause(addr) {
  _tpAddr = addr;
  const card = document.getElementById('tp-card');
  document.getElementById('tp-addr').textContent = addr;
  document.getElementById('tp-body').textContent = 'Loading…';
  document.getElementById('tp-note').textContent = '';
  document.getElementById('tp-clear-btn').disabled = true;
  card.style.display = '';
  card.scrollIntoView({ block: 'nearest' });
  try {
    const data = await API.get('/api/admin/miners/' + encodeURIComponent(addr));
    if (_tpAddr !== addr) return;
    renderTorPause((data && data.miner) || {});
  } catch (err) {
    if (_tpAddr === addr) document.getElementById('tp-body').textContent = 'Could not load: ' + err.message;
  }
}
function renderTorPause(m) {
  const tp = m.tor_pause;
  const pending = Array.isArray(m.pending_withdrawals) ? m.pending_withdrawals : [];
  let html;
  if (!tp) {
    html = 'Tor pause: <span style="color:var(--text-dim)">unavailable (scheduler not running)</span>';
  } else if (tp.paused_until) {
    html = `<span class="badge badge-error">Tor paused</span> until <strong>${escHtml(fmtUtc(tp.paused_until))}</strong>` +
           ` · ${escHtml(tp.failures_24h)} of ${escHtml(tp.max)} counted failures in the last 24 h`;
  } else {
    html = `<span class="badge badge-ok">Tor open</span> · ${escHtml(tp.failures_24h)} of ${escHtml(tp.max)} counted failures in the last 24 h`;
  }
  html += '<br>Pending: ' + (pending.length
    ? pending.map((w) => `payout ID ${escHtml(w.id)} · ${escHtml(w.method)} · ${escHtml(w.status)} · ${fmtGrin(w.amount)} ツ`).join('; ')
    : '<span style="color:var(--text-dim)">none</span>');
  document.getElementById('tp-body').innerHTML = html;
  const n = tp ? Number(tp.failures_24h) || 0 : 0;
  document.getElementById('tp-clear-btn').disabled = n === 0;
  document.getElementById('tp-note').textContent = n === 0 ? 'Nothing counted — nothing to clear.' :
    'Clearing un-counts these failures (history is kept). Use it when they were the pool’s fault.';
}
function closeTorPause() { _tpAddr = null; document.getElementById('tp-card').style.display = 'none'; }
async function clearTorPause() {
  const addr = _tpAddr;
  if (!addr) return;
  // confirm() only: a suppressed native dialog reads as Cancel, which is harmless here.
  if (!confirm(`Clear the Tor pause for ${addr}?\n\nIts counted Tor failures in the last 24 h stop counting (they stay in the history). Step-up required.`)) return;
  try {
    const res = await adminFetch('/api/admin/miners/' + encodeURIComponent(addr) + '/tor-pause/clear', { method: 'POST' });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
    flash(`Tor pause cleared — ${body.cleared} failure(s) un-counted.`, false);
    if (_tpAddr === addr) showTorPause(addr);
  } catch (err) { flash(err.message, true); }
}

document.addEventListener('DOMContentLoaded', loadMiners);
setInterval(loadMiners, 30000);
</script>
</body>
</html>
