<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600" role="img" aria-label="Feeling lucky? Block jackpots, prize draws, streak rewards and a monthly lottery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a14"/>
      <stop offset=".5" stop-color="#07090c"/>
      <stop offset="1" stop-color="#140a12"/>
    </linearGradient>
    <radialGradient id="magGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#ff4fd8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6ae0"/>
      <stop offset="1" stop-color="#d63bb2"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="158" height="598" rx="9"/></clipPath>
  </defs>

  <rect x="1" y="1" width="158" height="598" rx="9" fill="url(#bg)" stroke="#3a1d33" stroke-width="1.5"/>

  <g clip-path="url(#frame)">
    <!-- confetti -->
    <g fill="#ffb63d">
      <circle cx="30" cy="60" r="2"><animate attributeName="opacity" values="1;.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="132" cy="44" r="2.4"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="126" cy="250" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="26" cy="300" r="2.2"><animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="138" cy="430" r="2"><animate attributeName="opacity" values=".25;1;.25" dur="2.3s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#ff4fd8">
      <circle cx="46" cy="30" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="118" cy="150" r="1.8"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="22" cy="200" r="1.6"><animate attributeName="opacity" values=".4;1;.4" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="34" cy="470" r="1.8"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- jackpot orb -->
    <g transform="translate(80,124)">
      <circle r="58" fill="url(#magGlow)">
        <animate attributeName="opacity" values=".7;1;.7" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="36" fill="#150a13" stroke="#ff4fd8" stroke-opacity=".8" stroke-width="1.5"/>
      <circle r="45" fill="none" stroke="#ffb63d" stroke-opacity=".45" stroke-width="1.1" stroke-dasharray="3 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="14" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="36" fill="#ffb63d">7</text>
      <text x="-20" y="-10" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#ff4fd8">★</text>
      <text x="21" y="-8" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#ff4fd8">★</text>
    </g>

    <!-- headline -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="80" y="232" font-size="22" font-weight="bold" fill="#f2e6ef" letter-spacing="1.2">FEELING</text>
      <text x="80" y="262" font-size="24" font-weight="bold" fill="#ff4fd8" letter-spacing="1.2">LUCKY?</text>
    </g>

    <line x1="34" y1="282" x2="126" y2="282" stroke="#ff4fd8" stroke-opacity=".28" stroke-width="1"/>

    <!-- prizes -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#a894a3">
      <text x="24" y="312">★ block jackpots</text>
      <text x="24" y="340">★ prize draws</text>
      <text x="24" y="368">★ streak rewards</text>
      <text x="24" y="396">★ monthly lottery</text>
      <text x="24" y="424">★ join bonus</text>
    </g>

    <!-- fairness plate -->
    <g transform="translate(20,446)">
      <rect x="0" y="0" width="120" height="48" rx="7" fill="#180b16" stroke="#3a1d33"/>
      <text x="60" y="19" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#8a6f84" letter-spacing=".6">EVERY DRAW IS</text>
      <text x="60" y="35" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#8a6f84" letter-spacing=".6">PUBLICLY LOGGED</text>
    </g>

    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="80" y="522" font-size="9.5" fill="#6f5c6a" letter-spacing=".8">NO TICKET · JUST MINE</text>
    </g>

    <!-- CTA -->
    <g transform="translate(20,538)">
      <rect x="0" y="0" width="120" height="34" rx="7" fill="url(#cta)"/>
      <text x="60" y="22" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" font-weight="bold" fill="#120612" letter-spacing=".6">FORTUNE →</text>
    </g>
  </g>
</svg>
