<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600" role="img" aria-label="Buy GRIN — trade it on exchanges, or earn it by pointing a miner here">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12100a"/>
      <stop offset=".55" stop-color="#08090c"/>
      <stop offset="1" stop-color="#131009"/>
    </linearGradient>
    <radialGradient id="coinGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb63d" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#ffb63d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffb63d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd47a"/>
      <stop offset="1" stop-color="#e09321"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#e09321"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="158" height="598" rx="9"/></clipPath>
  </defs>

  <rect x="1" y="1" width="158" height="598" rx="9" fill="url(#bg)" stroke="#43331a" stroke-width="1.5"/>

  <g clip-path="url(#frame)">
    <g stroke="#ffb63d" stroke-opacity=".055" stroke-width="1">
      <path d="M0 110 H160 M0 220 H160 M0 330 H160 M0 440 H160"/>
      <path d="M53 0 V600 M107 0 V600"/>
    </g>

    <!-- candlestick strip -->
    <g transform="translate(0,40)">
      <g stroke="#3ecf8e" stroke-width="1.4" fill="#3ecf8e">
        <path d="M28 26 V54"/><rect x="24" y="32" width="8" height="16" rx="1"/>
        <path d="M60 14 V48"/><rect x="56" y="20" width="8" height="20" rx="1"/>
        <path d="M124 8 V42"/><rect x="120" y="12" width="8" height="22" rx="1"/>
      </g>
      <g stroke="#ff6b6b" stroke-width="1.4" fill="#ff6b6b">
        <path d="M92 22 V56"/><rect x="88" y="30" width="8" height="18" rx="1"/>
      </g>
      <path d="M28 40 L60 30 L92 40 L124 20" fill="none" stroke="#ffb63d" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 4"/>
    </g>

    <!-- coin -->
    <g transform="translate(80,180)">
      <circle r="52" fill="url(#coinGlow)">
        <animate attributeName="opacity" values=".65;1;.65" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <ellipse rx="34" ry="34" fill="url(#coinFace)" stroke="#8a5c12" stroke-width="1.5">
        <animate attributeName="rx" values="34;9;34" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <circle r="26" fill="none" stroke="#8a5c12" stroke-opacity=".45" stroke-width="1"/>
      <text x="0" y="12" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="30" font-weight="bold" fill="#3a2607">ツ</text>
    </g>

    <!-- headline -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="80" y="268" font-size="26" font-weight="bold" fill="#f2e9d8" letter-spacing="1.5">BUY</text>
      <text x="80" y="298" font-size="26" font-weight="bold" fill="#ffb63d" letter-spacing="1.5">GRIN</text>
    </g>

    <line x1="34" y1="318" x2="126" y2="318" stroke="#ffb63d" stroke-opacity=".28" stroke-width="1"/>

    <!-- copy -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="80" y="344" font-size="11.5" fill="#a1937c">Trade it on the</text>
      <text x="80" y="360" font-size="11.5" fill="#a1937c">exchanges —</text>
      <text x="80" y="384" font-size="11.5" fill="#a1937c">or skip the order</text>
      <text x="80" y="400" font-size="11.5" fill="#a1937c">book and just</text>
      <text x="80" y="424" font-size="15" font-weight="bold" fill="#ffd47a" letter-spacing=".5">MINE IT</text>
    </g>

    <!-- price plate -->
    <g transform="translate(20,446)">
      <rect x="0" y="0" width="120" height="52" rx="7" fill="#1a1409" stroke="#43331a"/>
      <text x="60" y="18" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#7d6c4d" letter-spacing="1">EMISSION</text>
      <text x="60" y="36" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" font-weight="bold" fill="#ffb63d">60 GRIN</text>
      <text x="60" y="47" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9" fill="#7d6c4d">every block · 60s</text>
    </g>

    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="80" y="524" font-size="9.5" fill="#6b5c40" letter-spacing=".8">NOT FINANCIAL ADVICE</text>
    </g>

    <!-- CTA -->
    <g transform="translate(20,540)">
      <rect x="0" y="0" width="120" height="34" rx="7" fill="url(#cta)"/>
      <text x="60" y="22" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="bold" fill="#241905" letter-spacing=".8">GET GRIN →</text>
    </g>
  </g>
</svg>
