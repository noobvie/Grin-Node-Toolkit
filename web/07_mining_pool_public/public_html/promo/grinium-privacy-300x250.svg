<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250" role="img" aria-label="Mine anonymously on GRINIUM — no accounts, no emails, Tor payouts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1016"/>
      <stop offset=".5" stop-color="#07090c"/>
      <stop offset="1" stop-color="#0b1410"/>
    </linearGradient>
    <radialGradient id="shieldGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5ad1ff" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#5ad1ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5ad1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aff80"/>
      <stop offset="1" stop-color="#3fd957"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="298" height="248" rx="10"/></clipPath>
  </defs>

  <rect x="1" y="1" width="298" height="248" rx="10" fill="url(#bg)" stroke="#1d3040" stroke-width="1.5"/>

  <g clip-path="url(#frame)">
    <!-- falling "onion route" dots -->
    <g fill="#5ad1ff" fill-opacity=".5">
      <circle cx="34" cy="0" r="1.8"><animate attributeName="cy" values="-10;260" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="0" r="1.8"><animate attributeName="cy" values="-10;260" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="252" cy="0" r="1.4"><animate attributeName="cy" values="-10;260" dur="8s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="52" cy="0" r="1.4"><animate attributeName="cy" values="-10;260" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- shield -->
    <g transform="translate(150,80)">
      <circle r="52" fill="url(#shieldGlow)">
        <animate attributeName="opacity" values=".7;1;.7" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M0,-36 C12,-28 26,-24 34,-24 C34,4 22,28 0,38 C-22,28 -34,4 -34,-24 C-26,-24 -12,-28 0,-36 Z"
            fill="#0a1116" stroke="#5ad1ff" stroke-opacity=".8" stroke-width="1.5"/>
      <text x="0" y="10" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#5dff73">ツ</text>
      <!-- scan line inside shield -->
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#5ad1ff" stroke-opacity=".5" stroke-width="1">
        <animate attributeName="y1" values="-28;30;-28" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="-28;30;-28" dur="4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- copy -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="150" y="158" font-size="20" font-weight="bold" fill="#e6efe9" letter-spacing="1.5">MINE ANONYMOUSLY</text>
      <text x="150" y="179" font-size="11.5" fill="#8a978f">No accounts · no emails</text>
      <text x="150" y="195" font-size="11.5" fill="#8a978f">Tor payouts · <tspan fill="#5ad1ff">privacy by design</tspan></text>
    </g>

    <!-- CTA -->
    <g transform="translate(60,208)">
      <rect x="0" y="0" width="180" height="30" rx="7" fill="url(#cta)"/>
      <text x="90" y="20" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" font-weight="bold" fill="#07090c" letter-spacing="1">SEE POOL PAYOUTS →</text>
    </g>
  </g>
</svg>
