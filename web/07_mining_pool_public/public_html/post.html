<!DOCTYPE html>
<html lang="en" data-page="post">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The real title, description and og tags for a given /blog/slug are injected
       SERVER-side (index.js "/blog/:slug" route, proxied by nginx), and the server REPLACES
       the title element below — a crawler never sees this default. It shows only for the
       instant before the client script resolves, so it must be a real name, not "Loading…".
       Favicon here: it never varies per post.
       Keep tag syntax OUT of this comment: the server locates the title element by pattern,
       and a literal one written here once made it delete this comment's opening, which
       silently commented out every stylesheet link below. -->
  <title>Blog — GRINIUM Mining Pool</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .post { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .post h1 { font-size: 2rem; margin: 0 0 .4rem; }
    .post .meta { color: var(--text-dim); font-size: .9rem; margin-bottom: 1.5rem; }
    .post .cover { width: 100%; max-height: 380px; object-fit: cover; border-radius: 10px; margin-bottom: 1.5rem; }
    .post-body { font-size: 1.05rem; line-height: 1.7; }
    .post-body h2 { color: var(--accent); margin-top: 2rem; }
    .post-body h3 { margin-top: 1.6rem; }
    .post-body a { color: var(--accent); }
    .post-body img { max-width: 100%; height: auto; border-radius: 8px; }
    .post-body blockquote { border-left: 3px solid var(--accent); margin: 1rem 0; padding: .3rem 1rem; color: var(--text-dim); }
    .post-body pre { background: var(--bg-elev2); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; overflow: auto; }
    .tag { display: inline-block; font-size: .75rem; padding: .12rem .55rem; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent); margin: 0 .35rem 0 0; }
    .back { display: inline-block; margin-bottom: 1.5rem; color: var(--accent); text-decoration: none; }
    .muted { color: var(--text-dim); }
  </style>
  <link rel="stylesheet" href="/css/themes.css">
</head>
<body>
  <noscript>
    <div class="noscript-note">
      <b>JavaScript is required.</b> This site builds its navigation and loads its live
      figures in the browser, so with scripts blocked the page stays empty. Enable
      JavaScript for this site to use it. The pool's data is also available as plain
      JSON over its <a href="/api-docs.html">public API</a> if you would rather not.
    </div>
  </noscript>
  <!-- header injected by /js/public-shell.js -->

  <main class="post" id="main" tabindex="-1">
    <a class="back" href="/blog.html">← All posts</a>
    <h1 id="post-title" class="muted">Loading…</h1>
    <div id="post-meta" class="meta"></div>
    <div id="post-cover"></div>
    <div id="post-body" class="post-body"></div>
    <div id="post-tags" style="margin-top:1.5rem;"></div>
  </main>

  <!-- footer injected by /js/public-shell.js -->

  <script>
    (function () {
      // Slug from the clean permalink /blog/<slug>; fall back to the legacy ?slug= form.
      var pathMatch = location.pathname.match(/^\/blog\/([A-Za-z0-9_-]+)/);
      var rawSlug = pathMatch ? pathMatch[1] : (new URLSearchParams(location.search).get('slug') || '');
      var slug = rawSlug.replace(/[^a-z0-9_-]/gi, '');
      if (!slug) { renderMissing(); return; }

      // Canonical URL is always the clean /blog/<slug> form (dedupes the legacy ?slug= path
      // for SEO). Skip if the server already injected one: /blog/<slug> is proxied to the
      // app, which emits a canonical built from the operator's configured site_url. Adding
      // a second one derived from location.origin would contradict it whenever the pool is
      // reached on a host other than site_url — and two conflicting canonicals make Google
      // discard both. The server's value wins; this only covers the legacy ?slug= entry.
      if (!document.querySelector('link[rel="canonical"]')) {
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = location.origin + '/blog/' + slug;
        document.head.appendChild(link);
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function fmtDate(unix) {
        if (!unix) return '';
        try { return new Date(unix * 1000).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }); }
        catch (e) { return ''; }
      }

      fetch('/api/public/post/' + encodeURIComponent(slug))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (json) {
          if (!json || !json.data) { renderMissing(); return; }
          var p = json.data;
          // Only when the server did NOT render the head (the legacy ?slug= entry point).
          // Its title is "<post> — <pool>"; overwriting it with the bare post title would
          // make the tab disagree with the search result and the shared card.
          if (!document.querySelector('meta[name="server-seo"]')) document.title = p.title;
          var t = document.getElementById('post-title');
          t.textContent = p.title;
          t.classList.remove('muted');
          document.getElementById('post-meta').textContent = fmtDate(p.published_at);
          if (p.cover_image) {
            document.getElementById('post-cover').innerHTML =
              '<img class="cover" src="' + esc(p.cover_image) + '" alt="">';
          }
          document.getElementById('post-body').innerHTML = p.body_html; // operator-authored
          var tags = (p.tags || []).map(function (tg) { return '<span class="tag">' + esc(tg) + '</span>'; }).join('');
          document.getElementById('post-tags').innerHTML = tags;
          document.documentElement.setAttribute('data-page', 'post-' + slug);
        })
        .catch(renderMissing);

      function renderMissing() {
        document.title = 'Post not found';
        document.getElementById('post-title').textContent = 'Post not found';
        document.getElementById('post-title').classList.remove('muted');
        document.getElementById('post-body').innerHTML =
          '<p class="muted">This post is not available. <a href="/blog.html">Back to the blog</a>.</p>';
      }
    })();
  </script>
  <script src="/js/public-shell.js"></script>
  <script src="/js/public-theme.js"></script>
  <script src="/js/branding.js"></script>
</body>
</html>
