<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600" role="img" aria-label="Mine anonymously — no accounts, no emails, payouts over Tor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a14"/>
      <stop offset=".55" stop-color="#07090c"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="onionGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bda4ff"/>
      <stop offset="1" stop-color="#7c5cf0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="158" height="598" rx="9"/></clipPath>
  </defs>

  <rect x="1" y="1" width="158" height="598" rx="9" fill="url(#bg)" stroke="#2c2340" stroke-width="1.5"/>

  <g clip-path="url(#frame)">
    <g stroke="#a78bfa" stroke-opacity=".055" stroke-width="1">
      <path d="M0 120 H160 M0 240 H160 M0 360 H160 M0 480 H160"/>
      <path d="M53 0 V600 M107 0 V600"/>
    </g>

    <!-- three-hop circuit -->
    <g transform="translate(0,52)">
      <path d="M26 0 L80 26 L134 0" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="3 5"/>
      <g fill="#a78bfa">
        <circle cx="26" cy="0" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="80" cy="26" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2s" begin=".6s" repeatCount="indefinite"/></circle>
        <circle cx="134" cy="0" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- onion layers -->
    <g transform="translate(80,160)">
      <circle r="54" fill="url(#onionGlow)">
        <animate attributeName="opacity" values=".6;1;.6" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="38" fill="none" stroke="#a78bfa" stroke-opacity=".28" stroke-width="1.2"/>
      <circle r="29" fill="none" stroke="#a78bfa" stroke-opacity=".45" stroke-width="1.2"/>
      <circle r="20" fill="#120e1c" stroke="#a78bfa" stroke-opacity=".8" stroke-width="1.5"/>
      <text x="0" y="8" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20" fill="#a78bfa">ツ</text>
    </g>

    <!-- headline -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="80" y="252" font-size="21" font-weight="bold" fill="#e8e3f5" letter-spacing="1.2">MINE</text>
      <text x="80" y="280" font-size="19" font-weight="bold" fill="#a78bfa" letter-spacing="1">ANONYMOUS</text>
    </g>

    <line x1="34" y1="300" x2="126" y2="300" stroke="#a78bfa" stroke-opacity=".28" stroke-width="1"/>

    <!-- what we never ask for -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#968ead">
      <text x="26" y="328">✕ no account</text>
      <text x="26" y="354">✕ no email</text>
      <text x="26" y="380">✕ no KYC</text>
      <text x="26" y="406">✕ no password</text>
      <text x="26" y="432" fill="#c6b8f5">✓ Tor payouts</text>
    </g>

    <!-- identity plate -->
    <g transform="translate(20,454)">
      <rect x="0" y="0" width="120" height="46" rx="7" fill="#120e1c" stroke="#2c2340"/>
      <text x="60" y="18" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#7b7192" letter-spacing=".6">YOUR SLATEPACK</text>
      <text x="60" y="33" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#7b7192" letter-spacing=".6">IS YOUR LOGIN</text>
    </g>

    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="80" y="526" font-size="9.5" fill="#645b7a" letter-spacing=".8">PAID STRAIGHT TO YOU</text>
    </g>

    <!-- CTA -->
    <g transform="translate(20,542)">
      <rect x="0" y="0" width="120" height="34" rx="7" fill="url(#cta)"/>
      <text x="60" y="22" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="bold" fill="#0d0918" letter-spacing=".8">MINE NOW →</text>
    </g>
  </g>
</svg>
