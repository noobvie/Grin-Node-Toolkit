<svg xmlns="http://www.w3.org/2000/svg" width="160" height="600" viewBox="0 0 160 600" role="img" aria-label="Mine GRIN here — no sign-up, PPLNS rewards, anonymous Tor payouts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset=".55" stop-color="#07090c"/>
      <stop offset="1" stop-color="#0c1410"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5dff73" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#5dff73" stop-opacity=".25"/>
      <stop offset="1" stop-color="#5dff73" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6aff80"/>
      <stop offset="1" stop-color="#3fd957"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5dff73" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5dff73" stop-opacity=".13"/>
      <stop offset="1" stop-color="#5dff73" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="158" height="598" rx="9"/></clipPath>
  </defs>

  <rect x="1" y="1" width="158" height="598" rx="9" fill="url(#bg)" stroke="#1d3a26" stroke-width="1.5"/>

  <g clip-path="url(#frame)">
    <!-- instrument grid -->
    <g stroke="#5dff73" stroke-opacity=".06" stroke-width="1">
      <path d="M0 100 H160 M0 200 H160 M0 300 H160 M0 400 H160 M0 500 H160"/>
      <path d="M40 0 V600 M80 0 V600 M120 0 V600"/>
    </g>
    <!-- vertical light sweep -->
    <rect x="0" y="-260" width="160" height="260" fill="url(#sweep)">
      <animate attributeName="y" values="-260;600" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- reactor core -->
    <g transform="translate(80,112)">
      <circle r="58" fill="url(#coreGlow)">
        <animate attributeName="opacity" values=".7;1;.7" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="34" fill="#0b1510" stroke="#5dff73" stroke-opacity=".7" stroke-width="1.5"/>
      <circle r="43" fill="none" stroke="#5dff73" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="4 7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="13" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="34" fill="#5dff73">ツ</text>
    </g>

    <!-- headline -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" text-anchor="middle">
      <text x="80" y="220" font-size="26" font-weight="bold" fill="#e6efe9" letter-spacing="1.5">MINE</text>
      <text x="80" y="250" font-size="26" font-weight="bold" fill="#5dff73" letter-spacing="1.5">GRIN</text>
      <text x="80" y="278" font-size="20" font-weight="bold" fill="#e6efe9" letter-spacing="1">HERE</text>
    </g>

    <line x1="34" y1="298" x2="126" y2="298" stroke="#5dff73" stroke-opacity=".28" stroke-width="1"/>

    <!-- selling points -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#93a49a">
      <text x="26" y="330">▸ no sign-up</text>
      <text x="26" y="356">▸ PPLNS pays</text>
      <text x="26" y="382">▸ low 1% fee</text>
      <text x="26" y="408">▸ Tor payouts</text>
      <text x="26" y="434">▸ prize draws</text>
    </g>

    <!-- your address is your account -->
    <g transform="translate(20,458)">
      <rect x="0" y="0" width="120" height="48" rx="7" fill="#0a1a12" stroke="#1d3a26"/>
      <text x="60" y="20" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#6d7f74" letter-spacing=".6">YOUR ADDRESS</text>
      <text x="60" y="36" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#6d7f74" letter-spacing=".6">IS YOUR ACCOUNT</text>
    </g>

    <!-- live tick -->
    <g transform="translate(0,527)">
      <circle cx="34" cy="-4" r="3.5" fill="#5dff73">
        <animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="45" y="0" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#5dff73" letter-spacing="1.2">STRATUM ONLINE</text>
    </g>

    <!-- Closing tagline, NOT a button — this creative ships with no click-through, so a
         filled pill with an arrow would be a button that does nothing. -->
    <g transform="translate(20,545)">
      <text x="60" y="22" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12.5" font-weight="bold" fill="#5dff73" letter-spacing=".8">NO SIGN-UP</text>
    </g>
  </g>
</svg>
